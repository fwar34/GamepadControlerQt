[package]
name = "gamepad_controler_slint"
version = "0.0.1"
edition = "2021"

# Windows 原生手柄 -> 键鼠映射器（Slint GUI 版）
# 复刻 L:\GamepadControlerQt（Qt Widgets 版）的全部功能

[build-dependencies]
slint-build = "1"

[dependencies]
# GUI：Slint（原生 Rust UI 框架，winit 后端 + 软件渲染）
slint = "1.17"

# Windows API：XInput 读取 + SendInput 注入
windows = { version = "0.62", features = [
    "Win32_Devices_HumanInterfaceDevice",
    "Win32_Foundation",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Input_XboxController",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_LibraryLoader",
] }

# 配置 JSON 读写
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# 日志
log = "0.4"

[profile.release]
opt-level = 3
